<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lucky Spin</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="page3.css"
    >

</head>


<body>


    <!-- =========================
         BACKGROUND LILIES
    ========================== -->

    <img
        class="background-lily lily-top"
        src="image/lily-icon.png"
        alt=""
    >

    <img
        class="background-lily lily-bottom"
        src="image/lily-icon.png"
        alt=""
    >


    <!-- =========================
         PAGE
    ========================== -->

    <main class="page">


        <!-- Heading -->

        <p class="little-text">
            A little surprise
        </p>


        <div class="heading-divider">

            <span></span>

            <img
                src="image/lily-icon.png"
                alt=""
            >

            <span></span>

        </div>


        <h1>
            Lucky Spin
        </h1>


        <h2>
            Let's see what you get ♡
        </h2>



        <!-- =========================
             GAME
        ========================== -->

        <section class="game">


            <div class="wheel-container">


                <!-- Fixed pointer -->

                <div class="pointer"></div>


                <!-- Rotating wheel -->

                <div
                    class="wheel"
                    id="wheel"
                >


                    <!-- Option 1 -->

                    <div
                        class="wheel-option option-1"
                    >
                        Unlimited<br>
                        Momos
                    </div>


                    <!-- Option 2 -->

                    <div
                        class="wheel-option option-2"
                    >
                        Make a Wish<br>

                        <small>
                            (tell me)
                        </small>
                    </div>


                    <!-- Option 3 -->

                    <div
                        class="wheel-option option-3"
                    >
                        Become<br>
                        Successful
                    </div>


                    <!-- Option 4 -->

                    <div
                        class="wheel-option option-4"
                    >
                        World Tour
                    </div>


                    <!-- Option 5 -->

                    <div
                        class="wheel-option option-5"
                    >
                        All of<br>
                        the Above
                    </div>


                </div>


                <!-- Fixed center -->

                <div class="wheel-center">

                    <img
                        src="image/lily-icon.png"
                        alt="Lily"
                    >

                </div>


            </div>


            <!-- Spin button -->

            <button
                class="spin-button"
                id="spinButton"
            >
                SPIN
            </button>


        </section>



        <!-- Result -->

        <div
            class="result"
            id="result"
        >

            <p>
                Spin the wheel to find out...
            </p>

        </div>



        <!-- Bottom message -->

        <p class="bottom-text">

            No matter where it lands,
            I think you're already lucky. ♡

        </p>



        <!-- Next page -->

        <a
            href="page4.html"
            class="next-button"
        >
            Continue →
        </a>


    </main>


    <script src="page3.js"></script>

</body>

</html>
