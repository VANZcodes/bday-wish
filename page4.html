<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mystery Gifts ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="page4.css">

</head>


<body>


    <!-- Background lilies -->

    <img
        class="corner-lily corner-lily-top"
        src="image/lily-icon.png"
        alt=""
    >

    <img
        class="corner-lily corner-lily-bottom"
        src="image/lily-icon.png"
        alt=""
    >


    <main class="page">


        <!-- Heading -->

        <p class="little-text">
            A little something for you
        </p>


        <div class="heading-divider">

            <span></span>

            <img
                class="heading-lily"
                src="image/lily-icon.png"
                alt=""
            >

            <span></span>

        </div>


        <h1>
            Mystery Gifts
        </h1>


        <h2>
            Claim All of Them...
        </h2>



        <!-- Gift boxes -->

        <section class="gift-grid">


            <button
                class="gift-box"
                data-gift="0"
                type="button"
            >

                <div class="gift-lid"></div>

                <div class="gift-body">

                    <img
                        class="gift-lily"
                        src="image/lily-icon.png"
                        alt=""
                    >

                    <span>
                        Mystery
                    </span>

                </div>

            </button>



            <button
                class="gift-box"
                data-gift="1"
                type="button"
            >

                <div class="gift-lid"></div>

                <div class="gift-body">

                    <img
                        class="gift-lily"
                        src="image/lily-icon.png"
                        alt=""
                    >

                    <span>
                        Mystery
                    </span>

                </div>

            </button>



            <button
                class="gift-box"
                data-gift="2"
                type="button"
            >

                <div class="gift-lid"></div>

                <div class="gift-body">

                    <img
                        class="gift-lily"
                        src="image/lily-icon.png"
                        alt=""
                    >

                    <span>
                        Mystery
                    </span>

                </div>

            </button>



            <button
                class="gift-box"
                data-gift="3"
                type="button"
            >

                <div class="gift-lid"></div>

                <div class="gift-body">

                    <img
                        class="gift-lily"
                        src="image/lily-icon.png"
                        alt=""
                    >

                    <span>
                        Mystery
                    </span>

                </div>

            </button>


        </section>



        <!-- Envelope -->

        <div
            class="gift-overlay"
            id="giftOverlay"
        >


            <div
                class="envelope"
                id="envelope"
            >


                <div class="letter">

                    <img
                        class="letter-lily"
                        src="image/lily-icon.png"
                        alt=""
                    >

                    <p class="letter-small">
                        Your mystery gift is...
                    </p>

                    <h3 id="giftMessage"></h3>

                    <p class="letter-heart">
                        ♡
                    </p>

                    <p class="voucher-text">
                        Gift Redeemed! Jehad is notified to honor this promise for You💫
                    </p>

                </div>


                <div class="envelope-flap"></div>

                <div class="envelope-front"></div>


            </div>


            <button
                class="close-gift"
                id="closeGift"
                type="button"
            >
                Close
            </button>


        </div>



        <p class="bottom-text">

            Some surprises are better
            when you don't know what's coming. ♡

        </p>

        <div class="next-page-container">
    <p class="next-page-text">
        There's one more thing...
    </p>

    <a href="page5.html" class="next-page-button">
        Continue
    </a>
</div>


    </main>


    <script src="page4.js"></script>

</body>

</html>
